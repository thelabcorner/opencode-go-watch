name: CI

# Same-repository PR validation is allowed on the homelab runner, but fork PRs are
# explicitly rejected before any attacker-controlled checkout can execute. Secrets
# and deployment remain push-to-main only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'thelabcorner'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    env:
      npm_config_cache: /_work/.npm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (lockfile, offline-first)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Validate (check + typecheck + test)
        run: npm run validate

      - name: Cloudflare bundle dry run
        run: npm run cf:dry-run

      - name: Live OpenCode Usage Yield smoke
        run: node scripts/live-usage-yield-smoke.mjs

  validate-and-deploy:
    if: github.event_name == 'push' && github.repository == 'thelabcorner/opencode-go-watch'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    env:
      npm_config_cache: /_work/.npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (lockfile, offline-first)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Validate (check + typecheck + test)
        run: npm run validate

      - name: Deploy to homelab
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COMPOSE_BAKE: 'true'
        run: |
          docker compose -f "$GITHUB_WORKSPACE/compose.yml" up -d --build
          docker image prune -f
          docker ps --filter name=opencode-go-watch --format "{{.Names}}: {{.Status}}"

          # The homelab uses `wrangler dev`, whose scheduled() handler is not fired
          # automatically. The cron sidecar must bootstrap both Go and Zen. Treat a
          # zero-model Zen state as a failed deployment instead of silently shipping it.
          verified=0
          for attempt in $(seq 1 36); do
            if docker exec opencode-go-watch node -e '
              Promise.all([
                fetch("http://127.0.0.1:8787/health").then((r) => r.json()),
                fetch("http://127.0.0.1:8787/zen/health").then((r) => r.json()),
              ]).then(([go, zen]) => {
                if (!go.ok || !(zen.modelCount > 0)) process.exit(1);
                console.log(`Go healthy; Zen ${zen.modelCount} models (${zen.freeCount} free)`);
              }).catch(() => process.exit(1));
            '; then
              verified=1
              break
            fi
            sleep 5
          done

          if [ "$verified" != "1" ]; then
            echo "Deployment verification failed: Go was unhealthy or Zen never populated a non-zero model baseline." >&2
            docker logs --tail 120 opencode-go-watch || true
            docker logs --tail 120 opencode-go-watch-cron || true
            exit 1
          fi

          docker ps --filter name=opencode-go-watch --format "{{.Names}}: {{.Status}}"
