name: CI

# SECURITY: push-only, main-only. No pull_request trigger —
# fork PRs would execute attacker-controlled code on the homelab runner.
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    # belt-and-suspenders guard against renamed/reused runners
    if: github.repository == 'thelabcorner/opencode-go-watch'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    env:
      npm_config_cache: /_work/.npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (lockfile, offline-first)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Validate (check + typecheck + test)
        run: npm run validate

      - name: Deploy to homelab
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COMPOSE_BAKE: 'true'
        run: |
          docker compose -f "$GITHUB_WORKSPACE/compose.yml" up -d --build
          docker image prune -f
          sleep 8
          docker ps --filter name=opencode-go-watch --format "{{.Names}}: {{.Status}}"
