name: Usage Yield V2 Validation

# Temporary pre-merge validation harness for PR #14. GitHub's scheduled event is
# platform-generated, so it exercises the self-hosted homelab runner even when API
# mutations do not emit a new Actions run. No repository secrets are exposed.
on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: usage-yield-v2-validation
  cancel-in-progress: true

jobs:
  validate-feature:
    if: github.repository == 'thelabcorner/opencode-go-watch'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    env:
      npm_config_cache: /_work/.npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usage-yield-v2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Validate
        run: npm run validate

      - name: Cloudflare bundle dry run
        run: npm run cf:dry-run

      - name: Live source smoke
        run: node scripts/live-usage-yield-smoke.mjs
