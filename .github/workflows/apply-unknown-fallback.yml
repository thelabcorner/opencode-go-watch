name: Apply unclassified-change fallback

on:
  push:
    paths:
      - scripts/apply-unknown-fallback.mjs
      - .github/workflows/apply-unknown-fallback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply fallback implementation
        run: node scripts/apply-unknown-fallback.mjs
      - name: Validate
        run: npm run validate
      - name: Commit implementation and remove one-shot patcher
        run: |
          rm scripts/apply-unknown-fallback.mjs
          rm .github/workflows/apply-unknown-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: surface unclassified monitored changes"
          git push
