name: Temporary Usage Yield rounding patch

on:
  push:
    branches: [fix/usage-yield-telegram-rounding]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/usage-yield-telegram-rounding

      - name: Round human-facing Usage Yield counts to whole requests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          go = Path('src/telegram.js')
          text = go.read_text()
          old = 'const NUMBER_FORMATTER = new Intl.NumberFormat("en-US", { maximumFractionDigits: 6 });\nconst COST_FORMATTER = new Intl.NumberFormat("en-US", { maximumFractionDigits: 8 });'
          new = 'const NUMBER_FORMATTER = new Intl.NumberFormat("en-US", { maximumFractionDigits: 6 });\nconst YIELD_FORMATTER = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });\nconst COST_FORMATTER = new Intl.NumberFormat("en-US", { maximumFractionDigits: 8 });'
          assert old in text
          text = text.replace(old, new, 1)
          old = '''function fmtYield(value) {
            if (typeof value !== "number" || !Number.isFinite(value)) return "—";
            return NUMBER_FORMATTER.format(value);
          }'''
          new = '''function fmtYield(value) {
            if (typeof value !== "number" || !Number.isFinite(value)) return "—";
            return YIELD_FORMATTER.format(value);
          }'''
          assert old in text
          go.write_text(text.replace(old, new, 1))

          zen = Path('src/zen-telegram.js')
          text = zen.read_text()
          old = 'const NUMBER = new Intl.NumberFormat("en-US", { maximumFractionDigits: 6 });\nconst COST = new Intl.NumberFormat("en-US", { maximumFractionDigits: 8 });'
          new = 'const NUMBER = new Intl.NumberFormat("en-US", { maximumFractionDigits: 6 });\nconst YIELD = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });\nconst COST = new Intl.NumberFormat("en-US", { maximumFractionDigits: 8 });'
          assert old in text
          text = text.replace(old, new, 1)
          old = '''function amount(value) {
            return typeof value === "number" && Number.isFinite(value) ? NUMBER.format(value) : "—";
          }'''
          new = '''function amount(value) {
            return typeof value === "number" && Number.isFinite(value) ? YIELD.format(value) : "—";
          }'''
          assert old in text
          zen.write_text(text.replace(old, new, 1))

          tests = Path('test/cost-telegram.test.js')
          text = tests.read_text()
          marker = '  assert.doesNotMatch(messages[0], /cheapest published tier/i);\n});'
          replacement = '''  assert.doesNotMatch(messages[0], /cheapest published tier/i);
  assert.match(messages[0], /~<b>[\\d,]+<\\/b> standardized requests \\/ Go monthly allowance/);
  assert.match(messages[0], /~<b>[\\d,]+<\\/b> equivalent req\\/\\$/);
  assert.doesNotMatch(messages[0], /~<b>[\\d,]+\\.\\d+<\\/b> (?:standardized requests|equivalent req\\/\\$)/);
});'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '  assert.doesNotMatch(messages[0], /Index = input \\+ output/);\n});'
          replacement = '''  assert.doesNotMatch(messages[0], /Index = input \\+ output/);
  assert.match(messages[0], /~<b>[\\d,]+<\\/b> equivalent agent requests \\/ \\$1/);
  assert.doesNotMatch(messages[0], /~<b>[\\d,]+\\.\\d+<\\/b> equivalent agent requests \\/ \\$1/);
});'''
          assert marker in text
          tests.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Validate targeted tests
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline && node --test test/cost-telegram.test.js

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/telegram.js src/zen-telegram.js test/cost-telegram.test.js
          git commit -m 'fix: round Telegram usage yield counts'
          git push origin HEAD:fix/usage-yield-telegram-rounding
