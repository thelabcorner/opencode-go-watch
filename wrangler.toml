name = "opencode-go-watch"
main = "src/entry.js"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

# The Workers Free plan already enforces a 10 ms CPU ceiling and rejects an
# explicit limits.cpu_ms during deployment (Cloudflare API error 100328). Keep a
# conservative subrequest ceiling here, which is supported on Free, and rely on
# the platform's built-in CPU limit rather than trying to restate it in config.
[limits]
subrequests = 32

# Workers Logs are useful for the handful of explicit watcher events, but automatic
# per-invocation logs would scale with arbitrary public dashboard traffic. Tracing is
# explicitly disabled ahead of its announced metered billing rollout.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[observability.traces]
enabled = false

# Workers Caching can serve explicitly cacheable GET responses before Worker
# execution. Sensitive/admin responses remain `no-store` in application code.
[cache]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
OPENCODE_GO_URL = "https://opencode.ai/go"
OPENCODE_DOCS_URL = "https://opencode.ai/docs/go/"
OPENCODE_ZEN_DOCS_URL = "https://opencode.ai/docs/zen/"
OPENCODE_ZEN_MODELS_URL = "https://opencode.ai/zen/v1/models"
WATCHER_DASHBOARD_URL = "https://opencode-go-watch.thedabcorner.workers.dev"
TIMEZONE = "America/Chicago"
NOTIFY_ON_BOOTSTRAP = "true"
NOTIFY_ON_ZEN_BOOTSTRAP = "true"

# Wrangler 4 automatic resource provisioning creates and binds this namespace
# on first remote deploy. Cloudflare keeps the provisioned namespace linked on
# future deploys even when its ID is not committed to the repository.
[[kv_namespaces]]
binding = "STATE"
