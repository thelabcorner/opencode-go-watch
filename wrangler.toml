name = "opencode-go-watch"
main = "src/index.js"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
OPENCODE_GO_URL = "https://opencode.ai/go"
OPENCODE_DOCS_URL = "https://opencode.ai/docs/go/"
OPENCODE_ZEN_DOCS_URL = "https://opencode.ai/docs/zen/"
OPENCODE_ZEN_MODELS_URL = "https://opencode.ai/zen/v1/models"
TIMEZONE = "America/Chicago"
NOTIFY_ON_BOOTSTRAP = "true"
NOTIFY_ON_ZEN_BOOTSTRAP = "true"

# Wrangler 4 automatic resource provisioning creates and binds this namespace
# on first remote deploy. Cloudflare keeps the provisioned namespace linked on
# future deploys even when its ID is not committed to the repository.
[[kv_namespaces]]
binding = "STATE"
