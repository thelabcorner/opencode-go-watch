name: opencode-go-watch
networks:
  homelab-net:
    external: true

services:
  app:
    build: .
    container_name: opencode-go-watch
    restart: unless-stopped
    networks: [homelab-net]
    # Hard cap: measured steady state is ~390MiB (anon ~350MiB), peak ~660MiB
    # including reclaimable page cache. 512m leaves headroom without letting
    # workerd balloon into the Docker Desktop VM's full 5.8GiB.
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      - watch-kv:/app/.wrangler/state   # KV (STATE binding) persistence
    healthcheck:
      # Docker health is process liveness, not watcher semantic health. `/health`
      # deliberately returns 503 while a persisted scrape failure exists; using it
      # here deadlocks recovery because the cron sidecar waits for service_healthy
      # before it can run the check that clears that persisted error.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s
    labels:
      - traefik.enable=true
      - traefik.http.routers.watch.rule=Host(`watch.lab.example.com`)
      - traefik.http.routers.watch.entrypoints=web
      - traefik.http.services.watch.loadbalancer.server.port=8787

  # wrangler dev does not fire the Worker's scheduled() handler by itself.
  # This sidecar is therefore the homelab scheduler and MUST invoke every
  # independently persisted watcher namespace, not only the Go watcher.
  # Ten-minute polling is deliberate: one-minute polling was unnecessarily
  # aggressive for pricing/catalog changes and multiplied upstream traffic 10x.
  cron:
    image: curlimages/curl:latest
    container_name: opencode-go-watch-cron
    restart: unless-stopped
    networks: [homelab-net]
    mem_limit: 32m
    mem_reservation: 8m
    depends_on:
      app:
        condition: service_healthy
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    entrypoint: >
      sh -c '
        while true; do
          for path in check zen/check; do
            if curl -fsS --max-time 45 -o /dev/null -X POST -H "Authorization: Bearer $$ADMIN_TOKEN" "http://app:8787/$$path"; then
              echo "$$(date -u) fired /$$path";
            else
              code=$$?;
              echo "$$(date -u) FAILED /$$path (curl exit $$code)" >&2;
            fi;
          done;
          sleep 600;
        done
      '
    labels: { traefik.enable: "false" }

volumes:
  watch-kv:
