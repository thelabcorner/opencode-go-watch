name: opencode-go-watch
networks:
  homelab-net:
    external: true

services:
  app:
    build: .
    container_name: opencode-go-watch
    restart: unless-stopped
    networks: [homelab-net]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      - watch-kv:/app/.wrangler/state   # KV (STATE binding) persistence
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.watch.rule=Host(`watch.lab.example.com`)
      - traefik.http.routers.watch.entrypoints=web
      - traefik.http.services.watch.loadbalancer.server.port=8787

  cron:
    image: curlimages/curl:latest
    container_name: opencode-go-watch-cron
    restart: unless-stopped
    networks: [homelab-net]
    depends_on: [app]
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    entrypoint: >
      sh -c 'while true; do
        curl -s -o /dev/null -X POST -H "Authorization: Bearer $ADMIN_TOKEN" http://app:8787/check;
        echo "$(date -u) fired /check";
        sleep 300;
      done'
    labels: { traefik.enable: "false" }

volumes:
  watch-kv:
